<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acid Shellscape</title>
<link rel="stylesheet" href="../tokens/acid-shellscape.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:var(--ground);color:var(--ink);font-family:var(--font-mono)}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px 40px}
h1{font:800 clamp(28px,5vw,56px)/1 var(--font-display);letter-spacing:-.03em;width:min(100%,1100px)}
h1 small{display:block;font:400 13px/1.5 var(--font-mono);color:var(--ink-dim);letter-spacing:0;margin-top:10px}

.win{width:min(100%,1100px);border:1px solid var(--line)}
.bar{height:22px;position:relative;background:var(--chrome);
  background-image:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.35) 3px 4px)}
.bar::before{content:"";position:absolute;left:7px;top:5px;width:11px;height:11px;border:1px solid var(--ink);background:var(--ground)}
.bar span{position:absolute;left:50%;top:0;transform:translateX(-50%);background:var(--chrome);padding:0 10px;font:400 12px/22px var(--font-mono)}
.stage{position:relative;aspect-ratio:16/9;background:var(--ground);overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}

.chip{position:absolute;left:3%;white-space:pre;background:var(--ink);color:var(--ground);font:400 clamp(8px,1.15vw,13px)/1.35 var(--font-mono);padding:0 .35em;opacity:0;transition:opacity .25s}
.chip.on{opacity:1}
.counter{position:absolute;right:3%;bottom:4%;background:var(--ink);color:var(--ground);font:800 clamp(40px,10vw,110px)/.85 var(--font-display);letter-spacing:-.06em;padding:.04em .06em 0 .02em;opacity:0;transition:opacity .25s}
.counter.on{opacity:1}

.ui{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;width:min(100%,1100px);font-size:12px}
.ui button{font:600 12px var(--font-mono);color:var(--ink);background:transparent;border:1px solid var(--ink-dim);padding:7px 12px;cursor:pointer}
.ui button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.ui button:hover{border-color:var(--ink)}
.ui input[type=range]{accent-color:var(--yellow);width:110px}
.ui .grp{display:flex;gap:4px;align-items:center}
.ui .sep{flex:1}
</style>
</head>
<body>

<h1>Acid Shellscape<small>paisagem abstrata feita só de células: blocos, meio-tom, pontos e caracteres.</small></h1>

<div class="win">
  <div class="bar"><span id="title">paisagem.js</span></div>
  <div class="stage">
    <canvas id="cv" width="1024" height="576"></canvas>
    <span class="chip" id="c1" style="top:5%"></span>
    <span class="chip" id="c2" style="top:11%"></span>
    <div class="counter" id="counter"></div>
  </div>
</div>

<div class="ui">
  <div class="grp" id="themes">tema
    <button data-t="dia"    aria-pressed="false">dia</button>
    <button data-t="poente" aria-pressed="true">pôr do sol</button>
    <button data-t="noite"  aria-pressed="false">noite</button>
  </div>
  <div class="grp">célula <input id="cell" type="range" min="12" max="24" step="4" value="16"></div>
  <span class="sep"></span>
  <button id="again">↻ nova composição</button>
  <button id="replay">▶ replay</button>
  <button id="save">↓ png</button>
</div>

<script>
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;

  /* ============================================================
     CENAS — a geometria de cada tema vive aqui; as CORES vêm dos
     tokens em ../tokens/acid-shellscape.css (uma paleta por data-theme)
     bands: quantas faixas de céu o tema usa · mtn: receita de cada cordilheira
     ============================================================ */
  const SCENES = {
    dia:    {hour:'12', chips:['const hora = 12;','sky.render("dia");'],         bands:5, sun:{x:.72,y:.32,rad:3.4}, cloud:{thr:.5},  mtn:['half','block','ascii']},
    poente: {hour:'18', chips:['const hora = 18;','sky.render("poente");'],      bands:6, sun:{x:.34,y:.44,rad:4.6}, cloud:{thr:.54}, mtn:['half','block','ascii']},
    noite:  {hour:'23', chips:['const hora = 23;','sky.render("noite");'],       bands:5, sun:{x:.27,y:.27,rad:2.7}, cloud:{thr:.58}, mtn:['half','block','ascii'], stars:true, aurora:true}
  };
  const THEMES = {};
  function loadThemes(){
    const root = document.documentElement, prev = root.getAttribute('data-theme');
    const css = n => getComputedStyle(root).getPropertyValue('--'+n).trim();
    for (const key in SCENES) {
      root.setAttribute('data-theme', key);
      const s = SCENES[key];
      THEMES[key] = {
        hour:s.hour, chips:s.chips, stars:s.stars, aurora:s.aurora ? css('lime') : null,
        bg:css('scene-bg'),
        sky:['sky-1','sky-2','sky-3','sky-4','sky-5','sky-6'].slice(0,s.bands).map(css),
        sun:{x:s.sun.x, y:s.sun.y, rad:s.sun.rad, col:css('sun'), halo:css('halo')},
        cloud:{col:css('cloud'), thr:s.cloud.thr},
        mtn:['mtn-far','mtn-mid','mtn-near'].map((n,i)=>({col:css(n), mode:s.mtn[i]})),
        rim:css('rim'),
        water:{bg:css('water-bg'), col:css('water'), hi:css('water-hi'), refl:css('reflection')}
      };
    }
    if (prev) root.setAttribute('data-theme', prev); else root.removeAttribute('data-theme');
  }
  loadThemes();

  /* ---------- estado ---------- */
  let themeKey = 'poente', cell = 16, cols, rows, wr, ridge = [], seed = 5;
  let P = 0, t0 = performance.now();
  const DUR = 6500, START = [0,.14,.26,.38,.5,.62,.72];   // sky, sol, nuvens, 3 montanhas, água
  const T = () => THEMES[themeKey];

  /* ---------- utilitários ---------- */
  const hash=(a,b,s=0)=>{let h=(a*374761393+b*668265263+s*2246822519)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967295};
  const vnoise=(x,y,s)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
  const fbm=(x,y,s)=>{let v=0,a=.5;for(let i=0;i<4;i++){v+=a*vnoise(x,y,s+i);x*=2;y*=2;a/=2}return v};
  const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
  const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`};

  /* ---------- geometria: cordilheiras e linha d'água ---------- */
  function buildGeo(){
    cols = Math.ceil(W/cell); rows = Math.ceil(H/cell); wr = Math.round(rows*.7);
    const u = 16/cell;
    ridge = [0,1,2].map(k=>{
      const hK=[9,6.5,4.2][k]*u, amp=[10,8,6][k]*u, f=[.035,.06,.1][k]/u, a=new Float32Array(cols);
      for(let c=0;c<cols;c++) a[c] = wr - Math.max(1.6*u, hK + amp*(fbm(c*f+k*13.7, k*3.1, seed+k)-.47)*2.6);
      return a;
    });
  }

  /* ---------- as 4 maneiras de pintar uma célula ---------- */
  const blk=(x,y,col)=>{ctx.fillStyle=col;ctx.fillRect(x,y,cell,cell)};
  function half(x,y,bg,fg,l){            // meio-tom: hachura diagonal cruzada
    if(bg){ctx.fillStyle=bg;ctx.fillRect(x,y,cell,cell)}
    ctx.save();ctx.beginPath();ctx.rect(x,y,cell,cell);ctx.clip();
    ctx.strokeStyle=fg;ctx.globalAlpha=.3+.7*l;ctx.lineWidth=1;
    const st=Math.max(2,Math.round(5-l*3));ctx.beginPath();
    for(let k=-cell;k<cell*2;k+=st){ctx.moveTo(x+k,y);ctx.lineTo(x+k+cell,y+cell);ctx.moveTo(x+k,y+cell);ctx.lineTo(x+k+cell,y)}
    ctx.stroke();ctx.restore();
  }
  function dots(x,y,bg,fg,l){            // matriz de quadradinhos
    if(bg){ctx.fillStyle=bg;ctx.fillRect(x,y,cell,cell)}
    const g=4,n=Math.floor(cell/g),d=Math.max(1,Math.round(l*3.2));ctx.fillStyle=fg;
    for(let a=0;a<n;a++)for(let b=0;b<n;b++)ctx.fillRect(x+a*g+1,y+b*g+1,d,d);
  }
  function glyph(x,y,ch,fg,bg){          // caractere de terminal
    if(bg){ctx.fillStyle=bg;ctx.fillRect(x,y,cell,cell)}
    ctx.fillStyle=fg;ctx.fillText(ch,x+cell*.12,y);
  }
  function blob(x,y,col,k){              // círculos que se fundem (como os blobs amarelos)
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+cell/2,y+cell/2,cell*k,0,6.283);ctx.fill();
  }

  /* ---------- revelação por camadas ---------- */
  function vis(L,c,r,bias){
    const q=clamp((P-START[L])/.24);
    return hash(c,r,seed+L*17)*.6+bias*.4 < q*1.02;
  }

  /* ---------- quadro ---------- */
  const WAVE='~-~=~-.~_';
  function frame(now){
    P = clamp((now-t0)/DUR);
    const tm=now/1000, th=T(), u=16/cell, tick=Math.floor(now/110);
    ctx.fillStyle=th.bg; ctx.fillRect(0,0,W,H);
    ctx.font=`${cell*.95}px "JetBrains Mono", monospace`; ctx.textBaseline='top';

    const sun=th.sun, sx=cols*(sun.x+(hash(1,1,seed)-.5)*.08), sy=wr*sun.y, srad=(sun.rad+.25*Math.sin(tm*1.3))*u;
    const bands=th.sky.length;

    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const x=c*cell, y=r*cell;

      /* --- água --- */
      if(r>=wr){
        if(!vis(6,c,r,(r-wr)/(rows-wr))) continue;
        const w=th.water, d=(r-wr)/(rows-wr);
        blk(x,y,mix(w.bg,w.col,.3+.5*(1-d)));
        const spd=(1.2+hash(0,r,1)*1.6)*(r%2?1:-1), ch=WAVE[((c+Math.floor(tm*spd)+r*3)%WAVE.length+WAVE.length)%WAVE.length];
        const dx=Math.abs(c-sx), wide=(1.2+srad*.55*(1+d*.8))*(.5+hash(c,r,Math.floor(tm*4))*.9);
        if(dx<wide) glyph(x,y,hash(c,r,tick)>.5?'=':'#',w.refl); // reflexo quebrado
        else if(ch!==' ') glyph(x,y,ch,mix(w.col,w.hi,.25+.6*hash(c,r,2)*(1-d)));
        continue;
      }

      /* --- montanhas (da mais perto para a mais longe) --- */
      let drew=false;
      for(let j=2;j>=0;j--){
        if(r<ridge[j][c]) continue;
        if(!vis(3+j,c,r,1-r/rows)) continue;
        const m=th.mtn[j], d=r-ridge[j][c], edge=d<1, bgd=mix(m.col,'#000000',.55);
        if(m.mode==='half')       half(x,y,bgd,edge?mix(m.col,th.rim,.6):m.col,.55+.4*(1-clamp(d/6)));
        else if(m.mode==='block') blk(x,y,edge?mix(m.col,th.rim,.5):mix(m.col,hash(c,r,9)>.5?'#ffffff':'#000000',.1*hash(c,r,8)));
        else                      glyph(x,y,edge?'=':'#%@&*+'[Math.floor(hash(c,r,4)*6)],edge?th.rim:mix(m.col,'#ffffff',.12+.12*hash(c,r,6)),mix(m.col,'#000000',.35));
        drew=true;break;
      }
      if(drew) continue;

      /* --- céu --- */
      const f=(r/wr)*bands, bi=clamp(Math.floor(f+(hash(c,r,5)-.5)*.9),0,bands-1), skyCol=th.sky[bi];
      if(vis(0,c,r,r/wr)){
        blk(x,y,skyCol);
        if(th.stars && hash(c,r,99)>.95 && r<wr*.62 && (hash(c,r,tick>>3)>.2)) glyph(x,y,hash(c,r,98)>.6?'+':'.','#ece8f0');
        if(th.aurora){const yy=wr*.3+2.4*Math.sin(c*.18+tm*.4+1),dd=Math.abs(r-yy);
          if(dd<1.6 && hash(c,r,7)>.25) dots(x,y,null,th.aurora,1-dd/1.6)}
      }
      // nuvens
      const n=fbm(c*.09/u+tm*.015, r*.33/u+4, seed+20);
      if(r>2 && r<wr-1 && n>th.cloud.thr && vis(2,c,r,c/cols)){
        const v=(n-th.cloud.thr)/.22;
        if(v>.6)       blk(x,y,mix(th.cloud.col,skyCol,.12));
        else if(v>.25) half(x,y,mix(skyCol,'#000000',.2),th.cloud.col,v);
        else           dots(x,y,null,th.cloud.col,v+.2);
      }
      // sol / lua
      const d=Math.hypot(c-sx,r-sy);
      if(d<srad+5 && vis(1,c,r,d/(srad+5))){
        if(d<srad+.5)           blob(x,y,sun.col,d>srad-.3?.45:.62);
        else if(d<srad+2.8)     dots(x,y,null,sun.halo,1-(d-srad)/2.8);
        else if(hash(c,r,13)<.3) glyph(x,y,'.',sun.halo);
      }
    }

    /* --- overlays (janela, etiquetas, contador) --- */
    const on=P>.88;
    document.getElementById('c1').textContent=th.chips[0];
    document.getElementById('c2').textContent=th.chips[1];
    document.getElementById('c1').classList.toggle('on',on);
    document.getElementById('c2').classList.toggle('on',P>.92);
    const cn=document.getElementById('counter'); cn.classList.toggle('on',on); cn.textContent=th.hour;
  }

  /* ---------- loop a 10 fps: movimento picotado ---------- */
  let last=0;
  (function loop(now){ if(now-last>100){last=now;frame(now)} requestAnimationFrame(loop) })(0);

  /* ---------- UI ---------- */
  const replay=()=>{t0=performance.now()};
  document.getElementById('replay').onclick=replay;
  document.getElementById('again').onclick=()=>{seed=Math.floor(Math.random()*9999);buildGeo();replay()};
  document.getElementById('themes').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return; themeKey=b.dataset.t;
    [...e.currentTarget.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',x===b)); replay();
  });
  document.getElementById('cell').oninput=e=>{cell=+e.target.value;buildGeo();replay()};
  document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=`paisagem-${themeKey}.png`;a.click()};

  // permite abrir direto num tema: ?tema=noite  e pular a animação: &fim=1
  const q=new URLSearchParams(location.search);
  if(THEMES[q.get('tema')]){themeKey=q.get('tema');document.querySelectorAll('#themes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===themeKey))}
  if(q.get('fim')) t0 = performance.now()-DUR-1000;
  buildGeo();
})();
</script>
</body>
</html>
