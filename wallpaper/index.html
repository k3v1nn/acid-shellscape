<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acid Shellscape · wallpaper</title>
<!-- Fonte: usa a instalada, depois fonts/JetBrainsMono-Regular.woff2 (offline), depois o Google Fonts. Sem nenhuma, cai em monospace. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Inter+Tight:wght@800&display=swap">
<style>
@font-face{font-family:"JetBrains Mono";font-weight:400;
  src:local("JetBrains Mono"),local("JetBrainsMono-Regular"),url("fonts/JetBrainsMono-Regular.woff2") format("woff2")}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;background:#121014;overflow:hidden;cursor:default}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;touch-action:none}
.chip,.counter{position:fixed;display:none;background:#ece8f0;color:#121014;white-space:pre}
.chip{left:3vw;font:400 clamp(10px,1.15vw,18px)/1.35 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;padding:0 .35em}
.counter{right:3vw;bottom:4vh;font:800 clamp(48px,9vw,150px)/.85 "Inter Tight","Helvetica Neue",Arial,sans-serif;letter-spacing:-.06em;padding:.04em .06em 0 .02em}
body.hud .chip,body.hud .counter{display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<span class="chip" id="c1" style="top:5vh"></span>
<span class="chip" id="c2" style="top:11vh"></span>
<div class="counter" id="counter"></div>

<script>
/* ==========================================================================
   Acid Shellscape · wallpaper interativo
   por Kevin · github @k3v1nn

   - a hora do dia escolhe o tema: amanhecer e entardecer = poente, dia, noite
   - o sol (ou a lua) percorre o céu de verdade, em passos de célula
   - o mouse empurra as camadas (parallax em passos inteiros), sopra as nuvens
     e o clique solta um anel de caracteres
   - 10 fps, sem easing, sem gradiente suave: tudo vem de hash(coluna, linha, semente)

   parâmetros de URL (todos opcionais):
     ?tema=auto|dia|poente|noite     auto = pela hora do computador
     &hora=18.5                      força a hora (0–24)
     &rapido=1                       simula 1 hora por segundo (teste)
     &linhas=36                      células no lado curto da tela (20–72)
     &fps=10                         8–12
     &parallax=1                     0 desliga, até 3
     &cursor=0                       esconde o cursor redondo
     &hud=1                          mostra as etiquetas e o contador da hora
     &fim=1                          pula a animação de entrada
     &semente=5                      outra composição de montanhas
   tecla p salva um png.
   ========================================================================== */
(() => {
  'use strict';
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const Q = new URLSearchParams(location.search);
  const num = (k, d) => (Q.has(k) && isFinite(parseFloat(Q.get(k)))) ? parseFloat(Q.get(k)) : d;

  const cfg = {
    tema: ['dia', 'poente', 'noite'].includes(Q.get('tema')) ? Q.get('tema') : 'auto',
    hora: Q.has('hora') ? num('hora', null) : null,
    rapido: num('rapido', 0),
    linhas: clamp(Math.round(num('linhas', 36)), 20, 72),
    fps: clamp(num('fps', 10), 8, 12),
    parallax: clamp(num('parallax', 1), 0, 3),
    cursor: Q.get('cursor') !== '0',
    hud: Q.get('hud') === '1',
    fim: Q.has('fim')
  };
  let seed = Math.round(num('semente', 5));
  document.body.classList.toggle('hud', cfg.hud);

  /* ---------- paletas: espelham tokens/acid-shellscape.css ---------- */
  const TH = {
    poente: { hour: 18, bg: '#1d1535', bands: ['#1d1535', '#4b2a73', '#9a4f9e', '#e9c4ff', '#f28c6a', '#f6c54a'],
      sun: '#f28c6a', halo: '#e6e61e', cloud: '#ffd0e8', cloudThr: .54, mtn: ['#6a3f8c', '#3a2459', '#150f22'], rim: '#f28c6a',
      water: { bg: '#1d1535', col: '#5a2f78', hi: '#e9c4ff', refl: '#f28c6a' } },
    dia: { hour: 12, bg: '#0f3d73', bands: ['#0f4f93', '#1f74c4', '#3f89cc', '#7fb2de', '#cfe0ea'],
      sun: '#e6e61e', halo: '#f4f6f8', cloud: '#ffffff', cloudThr: .5, mtn: ['#8fb0d0', '#2f6aa8', '#10304f'], rim: '#e8f0f6',
      water: { bg: '#0f3d73', col: '#1f74c4', hi: '#cfe0ea', refl: '#e6e61e' } },
    noite: { hour: 23, bg: '#090b18', bands: ['#07070c', '#0c0f24', '#101a3e', '#17285a', '#1f3a6e'],
      sun: '#ece8f0', halo: '#6f8fd0', cloud: '#3a4d94', cloudThr: .58, mtn: ['#26356b', '#161c3d', '#0a0b16'], rim: '#8fa8d8',
      water: { bg: '#090b18', col: '#16224a', hi: '#6f8fd0', refl: '#ece8f0' }, stars: true, aurora: '#c6f23a' }
  };
  const YELLOW = '#e6e61e';

  /* ---------- hora → cena → posição do sol ou da lua ---------- */
  const startMs = performance.now();
  const FIXED_HOUR = { dia: 12.3, poente: 17.2, noite: 23.5 };   // hora usada quando o tema é fixo
  function hourNow(now) {
    if (cfg.hora != null) return ((cfg.hora % 24) + 24) % 24;
    if (cfg.tema !== 'auto' && !cfg.rapido) return FIXED_HOUR[cfg.tema];
    const d = new Date();
    const base = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
    return (((base + (now - startMs) / 1000 * cfg.rapido) % 24) + 24) % 24;
  }
  const sceneFor = h => (h >= 7 && h < 17) ? 'dia' : (h >= 5 && h < 19.5) ? 'poente' : 'noite';
  // o sol nasce à direita e se põe à esquerda, às 12h fica no alto; a lua faz o mesmo entre 19:30 e 5:00
  function body(key, h) {
    if (key === 'noite') {
      const hh = h < 5 ? h + 24 : h, v = clamp((hh - 19.5) / 9.5);
      return { x: .80 - .48 * v, y: .78 - .52 * Math.sin(Math.PI * v), rad: 2.7 };
    }
    const u = clamp((h - 5) / 14.5), y = .78 - .56 * Math.sin(Math.PI * u);
    return { x: .80 - .48 * u, y, rad: 3.3 + Math.max(0, y - .3) * 4.4 };
  }

  /* ---------- aleatório estável e ruído ---------- */
  const hash = (a, b, s = 0) => { let h = (a * 374761393 + b * 668265263 + s * 2246822519) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295 };
  const vnoise = (x, y, s) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v };
  const fbm = (x, y, s) => { let v = 0, a = .5; for (let i = 0; i < 4; i++) { v += a * vnoise(x, y, s + i); x *= 2; y *= 2; a /= 2 } return v };
  const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})` };

  /* ---------- canvas e grade ---------- */
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, cell = 16, k = 1, cols = 0, rows = 0, wr = 0, ridge = [];
  const PAD = 8;                       // margem das cordilheiras, para o parallax não abrir buracos

  function buildGeo() {
    const vs = Math.pow(clamp(rows / 36, 1, 2.4), .62), fs = Math.max(1, 64 / cols);   // retrato: montanhas mais altas, mas sem engolir o sol
    ridge = [0, 1, 2].map(j => {
      const hK = [9, 6.5, 4.2][j] * vs, amp = [10, 8, 6][j] * vs, f = [.035, .06, .1][j] * fs, a = new Float32Array(cols + PAD * 2);
      for (let i = 0; i < a.length; i++) a[i] = wr - Math.max(1.6 * vs, hK + amp * (fbm((i - PAD) * f + j * 13.7, j * 3.1, seed + j) - .47) * 2.6);
      return a;
    });
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w = Math.max(64, Math.round((innerWidth || 1280) * dpr)), h = Math.max(64, Math.round((innerHeight || 720) * dpr));
    const f = Math.min(1, 2560 / Math.max(w, h)); w = Math.round(w * f); h = Math.round(h * f);
    if (cv.width !== w) cv.width = w;
    if (cv.height !== h) cv.height = h;
    W = w; H = h;
    cell = Math.max(8, Math.round(Math.min(W, H) / cfg.linhas / 4) * 4);   // múltiplo de 4: a matriz de pontos fecha certo
    k = cell / 16;
    cols = Math.ceil(W / cell); rows = Math.ceil(H / cell); wr = Math.round(rows * .7);
    buildGeo();
  }

  /* ---------- as quatro maneiras de pintar uma célula (+ blob) ---------- */
  const blk = (x, y, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, cell, cell) };
  function half(x, y, bg, fg, l) {
    if (bg) { ctx.fillStyle = bg; ctx.fillRect(x, y, cell, cell) }
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, cell, cell); ctx.clip();
    ctx.strokeStyle = fg; ctx.globalAlpha = .3 + .7 * l; ctx.lineWidth = Math.max(1, Math.round(k));
    const st = Math.max(2, Math.round((5 - l * 3) * k)); ctx.beginPath();
    for (let q = -cell; q < cell * 2; q += st) { ctx.moveTo(x + q, y); ctx.lineTo(x + q + cell, y + cell); ctx.moveTo(x + q, y + cell); ctx.lineTo(x + q + cell, y) }
    ctx.stroke(); ctx.restore();
  }
  function dots(x, y, bg, fg, l) {
    if (bg) { ctx.fillStyle = bg; ctx.fillRect(x, y, cell, cell) }
    const g = cell / 4, d = Math.max(1, Math.round(l * 3.2 * k)); ctx.fillStyle = fg;
    for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) ctx.fillRect(x + a * g + Math.round(k), y + b * g + Math.round(k), d, d);
  }
  function glyph(x, y, ch, fg, bg) {
    if (bg) { ctx.fillStyle = bg; ctx.fillRect(x, y, cell, cell) }
    ctx.fillStyle = fg; ctx.fillText(ch, x + cell * .12, y);
  }
  function blob(x, y, col, kk) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x + cell / 2, y + cell / 2, cell * kk, 0, 6.283); ctx.fill() }

  /* ---------- estado ---------- */
  let tick = 0, intro0 = performance.now(), introDone = false, P = 0;
  const DUR = 6500, START = [0, .14, .26, .38, .5, .62, .72];         // céu, sol, nuvens, 3 montanhas, água
  let curKey = null, fromKey = null, trans0 = 0;
  const TRANS = 3200;                                                  // troca de tema: ~3 s, célula a célula
  const ptr = { x: .5, y: .5, inside: false, moved: -1e9 };
  let targetOx = 0, curOx = 0, hostOffset = null, cloudPhase = 0;
  const ripples = [];

  const vis = (L, c, r, bias) => introDone || hash(c, r, seed + L * 17) * .6 + bias * .4 < clamp((P - START[L]) / .24) * 1.02;

  /* ---------- uma célula ---------- */
  const WAVE = '~-~=~-.~_';
  function paint(c, r, th, B, S, tm) {
    const x = c * cell, y = r * cell;

    if (r >= wr) {                                                     // água
      if (!vis(6, c, r, (r - wr) / (rows - wr))) return;
      const w = th.water, d = (r - wr) / (rows - wr), cw = c + S.water;
      blk(x, y, mix(w.bg, w.col, .3 + .5 * (1 - d)));
      const spd = (1.2 + hash(0, r, 1) * 1.6) * (r % 2 ? 1 : -1), ch = WAVE[((cw + Math.floor(tm * spd) + r * 3) % WAVE.length + WAVE.length) % WAVE.length];
      const seen = clamp((.74 - B.y) / .2), dx = Math.abs(c - B.sx), wide = seen * (1.2 + B.srad * .55 * (1 + d * .8)) * (.5 + hash(c, r, Math.floor(tm * 4)) * .9);
      if (seen > 0 && dx < wide) glyph(x, y, hash(c, r, tick) > .5 ? '=' : '#', w.refl);
      else if (ch !== ' ') glyph(x, y, ch, mix(w.col, w.hi, .25 + .6 * hash(cw, r, 2) * (1 - d)));
      return;
    }

    for (let j = 2; j >= 0; j--) {                                     // montanhas, da frente para trás
      const cc = c + S.mtn[j], ri = ridge[j][clamp(cc + PAD, 0, ridge[j].length - 1)];
      if (r < ri || !vis(3 + j, c, r, 1 - r / rows)) continue;
      const m = th.mtn[j], d = r - ri, edge = d < 1, bgd = mix(m, '#000000', .55);
      if (j === 0) half(x, y, bgd, edge ? mix(m, th.rim, .6) : m, .55 + .4 * (1 - clamp(d / 6)));
      else if (j === 1) blk(x, y, edge ? mix(m, th.rim, .5) : mix(m, hash(cc, r, 9) > .5 ? '#ffffff' : '#000000', .1 * hash(cc, r, 8)));
      else glyph(x, y, edge ? '=' : '#%@&*+'[Math.floor(hash(cc, r, 4) * 6)], edge ? th.rim : mix(m, '#ffffff', .12 + .12 * hash(cc, r, 6)), mix(m, '#000000', .35));
      return;
    }

    const bands = th.bands.length, f = (r / wr) * bands, bi = clamp(Math.floor(f + (hash(c, r, 5) - .5) * .9), 0, bands - 1), skyCol = th.bands[bi];
    if (vis(0, c, r, r / wr)) {                                        // céu
      blk(x, y, skyCol);
      if (th.stars && hash(c, r, 99) > .95 && r < wr * .62 && hash(c, r, tick >> 3) > .2) glyph(x, y, hash(c, r, 98) > .6 ? '+' : '.', '#ece8f0');
      if (th.aurora) { const yy = wr * .3 + 2.4 * Math.sin(c * .18 + tm * .4 + 1), dd = Math.abs(r - yy); if (dd < 1.6 && hash(c, r, 7) > .25) dots(x, y, null, th.aurora, 1 - dd / 1.6) }
    }
    const n = fbm((c + S.cloud) * .09 + cloudPhase, r * .33 + 4, seed + 20);   // nuvens
    if (r > 2 && r < wr - 1 && n > th.cloudThr && vis(2, c, r, c / cols)) {
      const v = (n - th.cloudThr) / .22;
      if (v > .6) blk(x, y, mix(th.cloud, skyCol, .12));
      else if (v > .25) half(x, y, mix(skyCol, '#000000', .2), th.cloud, v);
      else dots(x, y, null, th.cloud, v + .2);
    }
    const d = Math.hypot(c - B.sx, r - B.sy);                          // sol ou lua
    if (d < B.srad + 5 && vis(1, c, r, d / (B.srad + 5))) {
      if (d < B.srad + .5) blob(x, y, th.sun, d > B.srad - .3 ? .45 : .62);
      else if (d < B.srad + 2.8) dots(x, y, null, th.halo, 1 - (d - B.srad) / 2.8);
      else if (hash(c, r, 13) < .3) glyph(x, y, '.', th.halo);
    }
  }

  /* ---------- sobreposições: anéis de clique e cursor ---------- */
  const RING = '@%#*+=-:.';
  function overlay() {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const R = ripples[i], age = tick - R.t0, life = 16;
      if (age > life) { ripples.splice(i, 1); continue }
      const rad = 1 + age * 1.1, ch = RING[Math.min(RING.length - 1, Math.floor(age / life * RING.length))];
      const r0 = Math.max(0, Math.floor(R.r - rad - 1)), r1 = Math.min(rows - 1, Math.ceil(R.r + rad + 1));
      const c0 = Math.max(0, Math.floor(R.c - rad - 1)), c1 = Math.min(cols - 1, Math.ceil(R.c + rad + 1));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
        const d = Math.hypot((c - R.c) * .9, r - R.r);
        if (Math.abs(d - rad) < .75 && hash(c, r, tick) > .22) glyph(c * cell, r * cell, ch, YELLOW);
      }
    }
    if (cfg.cursor && ptr.inside && performance.now() - ptr.moved < 4000) {
      const pc = Math.floor(ptr.x * cols), pr = Math.floor(ptr.y * rows);
      for (let r = pr - 3; r <= pr + 3; r++) for (let c = pc - 3; c <= pc + 3; c++) {
        if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
        const d = Math.hypot(c - pc, r - pr);
        if (d < .5) blob(c * cell, r * cell, YELLOW, .62);
        else if (d < 2.7 && hash(c, r, 21) > .2) dots(c * cell, r * cell, null, YELLOW, 1 - (d - .5) / 2.2);
      }
    }
  }

  /* ---------- quadro ---------- */
  const hud = { c1: document.getElementById('c1'), c2: document.getElementById('c2'), n: document.getElementById('counter') };
  function frame(now) {
    tick++;
    P = clamp((now - intro0) / DUR); if (P >= 1) introDone = true;
    const h = hourNow(now), want = cfg.tema === 'auto' ? sceneFor(h) : cfg.tema, tm = now / 1000;
    if (want !== curKey) { fromKey = introDone && curKey ? curKey : want; curKey = want; trans0 = now }
    const tp = fromKey === curKey ? 1 : clamp((now - trans0) / TRANS);
    if (tp >= 1) fromKey = curKey;

    // mouse: o alvo muda a cada quadro, mas a camada anda no máximo uma célula por quadro (sem easing)
    const active = ptr.inside && now - ptr.moved < 20000;
    targetOx = hostOffset != null ? Math.round((hostOffset - .5) * 2 * 3 * cfg.parallax)
             : active ? Math.round(-(ptr.x - .5) * 2 * 3 * cfg.parallax) : 0;
    curOx += Math.sign(targetOx - curOx);
    const S = { sun: Math.round(curOx * .2), cloud: Math.round(curOx * .3), mtn: [Math.round(curOx * .33), Math.round(curOx * .67), curOx], water: curOx * 2 };
    cloudPhase += .0015 + (active ? (ptr.x - .5) * .025 : 0);

    const bodies = {};
    for (const key of [curKey, fromKey]) if (!bodies[key]) {
      const b = body(key, h);
      bodies[key] = { y: b.y, sx: cols * b.x + (hash(1, 1, seed) - .5) * .08 * cols + S.sun, sy: wr * b.y, srad: b.rad + .25 * Math.sin(tm * 1.3) };
    }

    ctx.fillStyle = TH[curKey].bg; ctx.fillRect(0, 0, W, H);
    ctx.font = `${cell * .95}px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace`; ctx.textBaseline = 'top';
    const toTh = TH[curKey], fromTh = TH[fromKey], toB = bodies[curKey], fromB = bodies[fromKey];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const useTo = tp >= 1 || hash(c, r, seed + 55) * .6 + (r / rows) * .4 < tp * 1.02;
      paint(c, r, useTo ? toTh : fromTh, useTo ? toB : fromB, S, tm);
    }
    overlay();

    if (cfg.hud) {
      const fixo = cfg.tema !== 'auto' && cfg.hora == null && !cfg.rapido, hh = fixo ? TH[curKey].hour : Math.floor(h);
      hud.c1.textContent = `const hora = ${hh};`; hud.c2.textContent = `sky.render("${curKey}");`; hud.n.textContent = hh;
    }
  }

  /* ---------- laço: 10 fps, picotado ---------- */
  let last = -1e9;
  (function loop(now) {
    if (now - last >= 1000 / cfg.fps - 4) { last = now; frame(now) }
    requestAnimationFrame(loop);
  })(0);

  /* ---------- entrada: mouse, toque, teclado ---------- */
  const setPtr = e => { ptr.x = clamp(e.clientX / Math.max(1, innerWidth)); ptr.y = clamp(e.clientY / Math.max(1, innerHeight)); ptr.inside = true; ptr.moved = performance.now() };
  const tap = (x01, y01) => ripples.push({ c: Math.floor(clamp(x01) * cols), r: Math.floor(clamp(y01) * rows), t0: tick });
  addEventListener('pointermove', setPtr, { passive: true });
  addEventListener('pointerdown', e => { setPtr(e); tap(ptr.x, ptr.y) }, { passive: true });
  addEventListener('pointerup', e => { if (e.pointerType === 'touch') ptr.inside = false }, { passive: true });
  document.addEventListener('mouseout', e => { if (!e.relatedTarget) ptr.inside = false });
  addEventListener('blur', () => { ptr.inside = false });
  addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 150) });
  addEventListener('keydown', e => { if (e.key === 'p') { const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = `shellscape-${curKey}.png`; a.click() } });

  /* ---------- ganchos para quem hospeda: Lively, Wallpaper Engine ---------- */
  const TEMAS = ['auto', 'dia', 'poente', 'noite'];
  function prop(name, v) {
    if (name === 'tema') { const t = typeof v === 'number' ? TEMAS[v] : String(v); if (TEMAS.includes(t)) cfg.tema = t }
    else if (name === 'celula' || name === 'linhas') { cfg.linhas = clamp(Math.round(+v), 20, 72); resize() }
    else if (name === 'fps') cfg.fps = clamp(+v, 8, 12);
    else if (name === 'parallax') cfg.parallax = clamp(+v, 0, 3);
    else if (name === 'cursor') cfg.cursor = !!v;
    else if (name === 'hud') { cfg.hud = !!v; document.body.classList.toggle('hud', cfg.hud) }
    else if (name === 'hora') cfg.hora = (v === '' || v == null || +v < 0) ? null : +v;
  }
  window.livelyPropertyListener = prop;                                // Lively (dropdown manda o índice)
  window.wallpaperPropertyListener = {                                 // Wallpaper Engine (combo manda o valor)
    applyUserProperties: p => { for (const key in p) if (p[key] && 'value' in p[key]) prop(key, p[key].value) }
  };
  window.shellscape = {                                                // para quem hospeda a página (WebView, Lively, etc.)
    point: (x, y) => { ptr.x = clamp(x); ptr.y = clamp(y); ptr.inside = true; ptr.moved = performance.now() },
    tap, leave: () => { ptr.inside = false },
    offset: x => { hostOffset = x == null ? null : clamp(x) },         // 0–1, ex.: rolagem entre telas inicias
    prop
  };

  resize();
  if (cfg.fim) { introDone = true; P = 1 }
})();
</script>
</body>
</html>
